# Evergreen & Original Content Topics Queue for Telegram AI Content Pipeline
# Rotating keyword list for autonomous original content generation without external URL dependencies.
# Note: URL-dependent categories (LEARNING_RESOURCES, AI_TOOLS, AI_NEWS) are handled via live feeds/search only.

evergreen_topics:
  TOP10_PROMPTS:
    - topic: "AI prompts for students & exam prep"
      audience: "Students & Academic Researchers"
      notes: "Focus on active recall, concept breakdown, essay outlining, and study scheduling."
    - topic: "AI prompts for code debugging & refactoring"
      audience: "Software Engineers & Developers"
      notes: "Focus on edge-case testing, memory leak detection, clean code principles, and unit test generation."
    - topic: "AI prompts for academic research & paper summaries"
      audience: "Researchers & Grad Students"
      notes: "Focus on extracting methodology, finding research gaps, literature review synthesis, and LaTeX formatting."
    - topic: "AI prompts for cold email outreach & client proposals"
      audience: "Freelancers, Agency Owners & Founders"
      notes: "Focus on high-conversion hooks, value propositions, follow-up sequences, and objection handling."
    - topic: "AI prompts for data analysis & SQL query generation"
      audience: "Data Analysts & Backend Developers"
      notes: "Focus on complex SQL joins, cohort retention analysis, regex patterns, and Pandas data transformations."
    - topic: "AI prompts for system architecture & API design"
      audience: "Tech Leads & Solution Architects"
      notes: "Focus on microservices decomposition, rate limiting design, OpenAPI spec generation, and caching strategies."

  AI_CAREER:
    - topic: "ChatGPT & Claude productivity workflows for students & developers"
      subtopic: "Daily AI Workflows & Student Productivity"
      notes: "Practical tricks to 5x study and coding output using system prompts, structured reasoning, and context window management."
    - topic: "AI Engineer portfolio project ideas with high market value"
      subtopic: "Portfolio Building & Project Selection"
      notes: "Focus on production RAG systems, evaluation harness, latency optimization, and multi-agent coordination."
    - topic: "How to prepare for AI Engineering & LLM developer technical interviews"
      subtopic: "Interview Preparation & Live Coding"
      notes: "Cover embedding distance metrics, prompt injection mitigation, streaming token handling, and latency benchmarking."
    - topic: "Transitioning from traditional Software Engineering to AI Engineering"
      subtopic: "Career Transition & Skill Upskilling"
      notes: "Highlight the shift from deterministic logic to probabilistic outputs, evaluation frameworks (Ragas), and vector DBs."
    - topic: "Building a production-ready RAG application for your resume"
      subtopic: "Resume-grade AI Projects"
      notes: "Emphasize hybrid search (BM25 + Dense Vectors), reranking (Cohere), chunking strategies, and caching."

  AGENTIC_AI:
    - topic: "Understanding Model Context Protocol (MCP) and Tool Calling"
      audience: "AI Developers & System Architects"
      notes: "Explain how MCP standardizes tool connectivity between AI clients and external systems."
    - topic: "Autonomous Agent Architectures: ReAct vs Plan-and-Solve vs Reflection"
      audience: "Software Engineers & AI Researchers"
      notes: "Break down core cognitive patterns for modern AI agents."
    - topic: "Memory Management and State Persistence in Long-Running AI Agents"
      audience: "AI Engineers"
      notes: "Explain short-term vs long-term memory, vector store retrieval, and session pruning."

  AI_AUTOMATION:
    - topic: "Top automation workflows for AI developer productivity"
      audience: "Automation Engineers & Developers"
      notes: "Showcase automated newsletter summarizers, GitHub issue triage bots, and automated RSS monitors."
    - topic: "Building self-healing automation pipelines with LLMs and webhooks"
      audience: "DevOps & Pipeline Engineers"
      notes: "Error interception, dynamic retry prompts, and automated notification loops."
