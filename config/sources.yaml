      url: "https://rss.arxiv.org/rss/cs.AI"
      trust_level: 1

  technology:
    - name: "Ars Technica Information Technology"
      url: "https://feeds.arstechnica.com/arstechnica/technology-lab"
      trust_level: 2

  top10_prompts:
    - name: "Top AI Prompts & Techniques (Google News RSS)"
      url: "https://news.google.com/rss/search?q=%22Prompt+Engineering%22+OR+%22System+Prompt%22+OR+%22LLM+Prompts%22&hl=en-US&gl=US&ceid=US:en"
      trust_level: 2
