# Curated High-Signal Source Feeds for Telegram AI Content Pipeline
# Trust Levels:
#   1 = Official / Primary Research / Direct Lab Releases
#   2 = Tier-1 Tech Journalism / Authoritative Industry Reporting
#   3 = Specialized Community & Curated Aggregators

sources:
  ai_news:
    - name: "OpenAI News & Announcements"
      url: "https://openai.com/news/rss.xml"
      trust_level: 1
    - name: "Google AI Blog"
      url: "https://blog.google/technology/ai/rss/"
      trust_level: 1
    - name: "MIT Technology Review AI"
      url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
      trust_level: 2
    - name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      trust_level: 2
    - name: "VentureBeat AI"
      url: "https://venturebeat.com/category/ai/feed/"
      trust_level: 2

  ai_industry_startups:
    - name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
      trust_level: 1
    - name: "TechCrunch Enterprise & Startups"
      url: "https://techcrunch.com/category/startups/feed/"
      trust_level: 2

  ai_tools:
    - name: "AI Tools & Product Releases (Google News RSS)"
      url: "https://news.google.com/rss/search?q=Artificial+Intelligence+Tools+OR+LLM+Release&hl=en-US&gl=US&ceid=US:en"
      trust_level: 2

  agentic_ai:
    - name: "Agentic AI & Autonomous Agents (Google News RSS)"
      url: "https://news.google.com/rss/search?q=%22AI+Agents%22+OR+%22Agentic+AI%22+OR+%22Autonomous+Agents%22&hl=en-US&gl=US&ceid=US:en"
      trust_level: 2

  ai_automation:
    - name: "AI Workflow & Automation (Google News RSS)"
      url: "https://news.google.com/rss/search?q=%22AI+Automation%22+OR+%22LLM+Workflow%22+OR+%22Generative+AI+Workflow%22&hl=en-US&gl=US&ceid=US:en"
      trust_level: 2

  ai_career:
    - name: "AI Engineering & Career (Google News RSS)"
      url: "https://news.google.com/rss/search?q=%22AI+Engineer%22+OR+%22Prompt+Engineer%22+OR+%22AI+Jobs%22&hl=en-US&gl=US&ceid=US:en"
      trust_level: 2

  cybersecurity:
    - name: "BleepingComputer"
      url: "https://www.bleepingcomputer.com/feed/"
      trust_level: 2
    - name: "The Hacker News"
      url: "https://feeds.feedburner.com/TheHackersNews"
      trust_level: 2

  learning_resources:
